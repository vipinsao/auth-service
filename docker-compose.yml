# Brings up PostgreSQL and the auth service together.
#   docker compose up --build
# The API is then on http://localhost:5501 and the docs on /api-docs.
#
# Environment variables set here win over any .env.* file, because dotenv never
# overwrites a variable that is already present in the process environment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authservice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: dev
      PORT: 5501
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: authuser
      DB_PASSWORD: authpass
      DB_NAME: authservice
      # Local-only value. Generate a real one for any deployed environment.
      REFRESH_TOKEN_SECRET: local-compose-refresh-secret-change-me
      CORS_ORIGINS: http://localhost:3000
      MAIL_TRANSPORT: json
    ports:
      - "5501:5501"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres-data:
